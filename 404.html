<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sayfa bulunamadı — Lote Triko</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="/lote-triko/assets/img/favicon.png" type="image/png">
<style>
  :root{--paper:#faf8f4;--ink:#1c1b19;--ink-2:#4a4741;--ink-3:#8a857c;--line:#ddd7cc;--accent:#8a6a3f}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:"Inter","Helvetica Neue",Arial,sans-serif;font-size:16.5px;line-height:1.7;
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 24px;
    -webkit-font-smoothing:antialiased}
  .box{max-width:560px;text-align:center}
  .mark{font-family:"Cormorant Garamond",Georgia,serif;font-size:30px;letter-spacing:.18em;
    text-transform:uppercase;display:block;margin-bottom:6px}
  .sub{font-size:10.5px;letter-spacing:.3em;color:var(--ink-3);text-transform:uppercase}
  .code{font-family:"Cormorant Garamond",Georgia,serif;font-size:76px;line-height:1;
    margin:38px 0 10px;color:var(--accent)}
  h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;font-size:32px;margin:0 0 14px}
  p{color:var(--ink-2);margin:0 0 10px}
  .links{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:30px}
  a.btn{display:inline-flex;align-items:center;padding:14px 28px;border:1px solid var(--ink);
    border-radius:3px;font-size:12px;letter-spacing:.15em;text-transform:uppercase;
    text-decoration:none;color:inherit;transition:.2s}
  a.btn:hover{background:var(--ink);color:var(--paper)}
  a.btn.ghost{border-color:var(--line)}
  a.btn.ghost:hover{background:var(--ink);border-color:var(--ink)}
  .hint{margin-top:34px;padding-top:22px;border-top:1px solid var(--line);
    font-size:13.5px;color:var(--ink-3)}
  code{background:#fff;border:1px solid var(--line);border-radius:3px;padding:3px 7px;
    font-size:12.5px;word-break:break-all}
</style>
</head>
<body>
  <div class="box">
    <span class="mark">Lote</span>
    <span class="sub">Triko</span>

    <div class="code">404</div>
    <h1>Bu sayfa bulunamadı</h1>
    <p>Aradığınız sayfa taşınmış veya adres yanlış yazılmış olabilir.</p>

    <div class="links">
      <a class="btn" href="/lote-triko/">Anasayfaya dön</a>
      <a class="btn ghost" href="/lote-triko/katalog.html">Panel Arşivi</a>
      <a class="btn ghost" href="/lote-triko/iletisim.html">Bize Ulaşın</a>
    </div>

    <div class="hint">
      Sitenin doğru adresi:<br>
      <code>gorkemedizozpekmezci-del.github.io/lote-triko/</code>
    </div>
  </div>
</body>
</html>
